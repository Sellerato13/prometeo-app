name: Build ProMeteo Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProMeteo-Android-Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm init -y && npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ProMeteo-APK
          path: ProMeteo-Android-Project/android/app/build/outputs/apk/debug/app-debug.apk
